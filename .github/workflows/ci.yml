name: cordis

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Audit dependencies (RustSec)
        run: cargo audit

  rust:
    name: rust (${{ matrix.toolchain }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # Maintained successor to dtolnay/rust-toolchain: rustup install +
      # built-in cargo caching (Swatinem/rust-cache) + cargo/rustfmt/clippy
      # problem matchers. Releases are versioned (v2.x), unlike dtolnay's
      # rolling branches.
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test
      - name: test (supervision feature)
        run: cargo test --features supervision
      - name: clippy (supervision feature)
        run: cargo clippy --all-targets --features supervision -- -D warnings
      - name: doc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps
      # docs.rs builds with every feature ([package.metadata.docs.rs]
      # all-features = true), so the rendered docs must be warning-free in that
      # configuration too.
      - name: doc (all features)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features
      - name: release build (overflow-checks)
        run: cargo build --release
      - name: panic=abort is rejected at compile time
        run: |
          if RUSTFLAGS="-C panic=abort" cargo check --lib >/dev/null 2>&1; then
            echo "panic=abort build unexpectedly succeeded" >&2
            exit 1
          fi
          echo "panic=abort rejected as expected"

