name: cordis

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Audit dependencies (RustSec)
        run: cargo audit

  rust:
    name: rust (${{ matrix.toolchain }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # Maintained successor to dtolnay/rust-toolchain: rustup install +
      # built-in cargo caching (Swatinem/rust-cache) + cargo/rustfmt/clippy
      # problem matchers. Releases are versioned (v2.x), unlike dtolnay's
      # rolling branches.
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      # Executable architecture guard: the kernel must not grow business/I/O/
      # runtime dependencies or domain vocabulary (see docs/KERNEL-BOUNDARY.md).
      - name: kernel boundary
        run: cargo test --locked --test kernel_boundary
      - name: test
        run: cargo test --locked
      - name: test (supervision feature)
        run: cargo test --locked --features supervision
      - name: clippy (supervision feature)
        run: cargo clippy --all-targets --locked --features supervision -- -D warnings
      - name: doc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --locked
      # docs.rs builds with every feature ([package.metadata.docs.rs]
      # all-features = true), so the rendered docs must be warning-free in that
      # configuration too.
      - name: doc (all features)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --locked --all-features
      - name: examples build
        run: cargo build --examples --locked
      - name: examples smoke run
        run: |
          cargo run --locked --quiet --example hello
          cargo run --locked --quiet --example services
          cargo run --locked --quiet --example events
          cargo run --locked --quiet --example async_plugin
      # A real package build + `cargo verify` of the staged crate, not just a
      # file listing: catches manifest/include/readme mistakes before release.
      - name: package verify
        run: cargo package --locked
      - name: release build (overflow-checks)
        run: cargo build --release --locked
      - name: panic=abort is rejected at compile time
        run: |
          if RUSTFLAGS="-C panic=abort" cargo check --lib --locked >/dev/null 2>&1; then
            echo "panic=abort build unexpectedly succeeded" >&2
            exit 1
          fi
          echo "panic=abort rejected as expected"

  # The declared MSRV (`rust-version = "1.85"` in Cargo.toml) must be verified
  # with a real toolchain, not by a lint. Clippy is *not* run here on purpose:
  # lint sets change per release (e.g. `mutex_integer` fires on 1.85 but not on
  # stable), while build/test/doc must stay green across the MSRV.
  msrv:
    name: msrv (1.85.0)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Rust 1.85.0
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: 1.85.0
      - name: test (MSRV)
        run: cargo test --locked
      - name: test (MSRV, supervision feature)
        run: cargo test --locked --features supervision
      - name: doc (MSRV, all features)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --locked --all-features
