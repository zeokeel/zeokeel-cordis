[package]
name = "cordis"
version = "0.3.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"
repository = "https://github.com/zeokeel/Cordis"
description = "Cordis-paradigm pluggable kernel core for Rust: context/service/fiber/effect/events/registry"
keywords = ["cordis", "plugin", "dependency-injection", "kernel"]
categories = ["development-tools"]
readme = "README.md"

# Strictest supported build configuration.
# - panic=unwind is mandatory: panic containment is implemented with
#   `catch_unwind` (see the compile-time guard in src/lib.rs).
# - overflow-checks in release turns integer overflow into a panic that the
#   kernel's containment can observe, instead of silent wrap-around.
# - one codegen unit + thin LTO give reproducible, whole-crate optimization;
#   raise/remove if your build time matters more than strictness.
[profile.dev]
panic = "unwind"

[profile.test]
panic = "unwind"

[profile.bench]
panic = "unwind"

[profile.release]
panic = "unwind"
overflow-checks = true
codegen-units = 1
lto = "thin"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
await_holding_lock = "deny"
mutex_integer = "deny"

[dependencies]
serde_json = "1"
tracing = { version = "0.1", features = ["log"] }
futures-util = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "sync"] }
tracing-subscriber = "0.3"
